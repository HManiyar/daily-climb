name: Publish to GitHub Pages

# GitHub Pages serves the site from the gh-pages branch.
# Each run copies main, adds a freshly built feed.json (tech good news and
# "how they got in" stories), and publishes it to gh-pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *" # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-feed.js feed.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f feed.json
          git commit -q -m "Update news feed"
          git push --force origin HEAD:refs/heads/gh-pages
