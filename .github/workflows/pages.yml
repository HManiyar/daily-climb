name: Publish to GitHub Pages

# GitHub Pages serves the site from the gh-pages branch.
# Every push to main mirrors main into gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/gh-pages
